services:
  pain-server:
    build:
      context: .
      dockerfile: pain-server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@pain-db:5432/pain_db
    depends_on:
      - pain-db
    volumes:
      - ./pain-server/data:/usr/src/app/data

  pain-db:
    build:
      context: ./pain-db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pain_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: