services:
  pain-server:
    build:
      context: .
      dockerfile: pain-server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@pain-db:5432/pain_db
      - PAIN_MESSAGE_URL=http://pain-message:7246
    depends_on:
      - pain-db
    volumes:
      - ./pain-server/data:/usr/src/app/data
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  pain-message:
    image: ghcr.io/cstelmach/pain-message@sha256:b98e0bd1d96a8beff8ef2de6348255b12ffa7a832cc7ff6b75c47de17e8ac704
    restart: unless-stopped
    environment:
      - PAIN_MESSAGE_HOST=0.0.0.0
      - PAIN_MESSAGE_PORT=7246
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pain-db:
    build:
      context: ./pain-db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pain_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
